name: DevShield CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
- name: Install Dependencies
        run: npm ci

      - name: Validate action.yml
        run: |
          node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('action.yml', 'utf8');
            if (!yaml.includes('runs:')) {
              console.error('action.yml missing runs: block');
              process.exit(1);
            }
            console.log('action.yml looks valid ✅');
          "

      - name: Verify package.json is valid
        run: node -e "require('./package.json'); console.log('package.json OK ✅')"
