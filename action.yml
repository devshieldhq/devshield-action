name: DevShield Security Scan

description: >
  Developer-first application security scanner that detects vulnerabilities,
  generates SARIF reports, and blocks insecure deployments before production.

author: DevShield

branding:
  icon: shield
  color: blue

inputs:
  required-paths:
    description: "Comma-separated list of files or directories that must exist before scanning."
    required: false
    default: "package.json"

  node-version:
    description: "Node.js version used to run DevShield."
    required: false
    default: "20"

outputs:
  passed:
    description: "Whether the security scan passed."

  report:
    description: "Path to the generated DevShield report."

runs:
  using: composite

  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install Dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install

    - name: Run DevShield Security Scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        DEVSHIELD_REQUIRED_PATHS: ${{ inputs.required-paths }}
      run: |
        node "${{ github.action_path }}/devshield/bin/devshield.js" deploy-check . --sarif --html
